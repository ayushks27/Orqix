apiVersion: v1
kind: ConfigMap
metadata:
  name: orqix-config
  namespace: default
data:
  DATABASE_URL: "postgresql://orqix_user:orqix_password@postgres-service:5432/orqix"
  REDIS_URL: "redis://redis-service:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "redpanda-service:9092"
  MINIO_ENDPOINT: "minio-service:9000"
  NEO4J_URI: "bolt://neo4j-service:7687"

---
# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orqix-gateway
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orqix-gateway
  template:
    metadata:
      labels:
        app: orqix-gateway
    spec:
      containers:
      - name: gateway
        image: orqix/gateway:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: orqix-config

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: default
spec:
  selector:
    app: orqix-gateway
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: LoadBalancer

---
# Experiment Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orqix-experiment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orqix-experiment
  template:
    metadata:
      labels:
        app: orqix-experiment
    spec:
      containers:
      - name: experiment
        image: orqix/experiment:latest
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: orqix-config

---
apiVersion: v1
kind: Service
metadata:
  name: experiment-service
  namespace: default
spec:
  selector:
    app: orqix-experiment
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001

---
# Scheduler Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orqix-scheduler
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orqix-scheduler
  template:
    metadata:
      labels:
        app: orqix-scheduler
    spec:
      containers:
      - name: scheduler
        image: orqix/scheduler:latest
        ports:
        - containerPort: 8003
        envFrom:
        - configMapRef:
            name: orqix-config

---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-service
  namespace: default
spec:
  selector:
    app: orqix-scheduler
  ports:
  - protocol: TCP
    port: 8003
    targetPort: 8003

---
# Dataset Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orqix-dataset
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orqix-dataset
  template:
    metadata:
      labels:
        app: orqix-dataset
    spec:
      containers:
      - name: dataset
        image: orqix/dataset:latest
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: orqix-config

---
apiVersion: v1
kind: Service
metadata:
  name: dataset-service
  namespace: default
spec:
  selector:
    app: orqix-dataset
  ports:
  - protocol: TCP
    port: 8004
    targetPort: 8004
